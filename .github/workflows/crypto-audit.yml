name: AOTS6 Crypto Audit
on:
 push: {branches: ["**"]}
 pull_request: {branches: ["main"]}
permissions: {contents: read}
jobs:
 crypto:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - run: python -m pip install --disable-pip-version-check -r requirements-crypto.txt
   - run: python -m compileall -q crypto tests
   - run: python -m unittest discover -s tests -v
   - name: Secret pattern gate
     shell: bash
     run: '! grep -RInE --exclude-dir=.git --exclude="*.md" "(BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})" .'
